<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Explore nine days of NASA Astronomy Pictures of the Day." />
  <title>NASA Space Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <form id="dateForm" class="filters">
      <label>Start date <input type="date" id="startDate" required /></label>
      <label>End date <input type="date" id="endDate" required /></label>
      <button id="fetchButton" type="submit">Get Space Images</button>
    </form>
    <p class="hint">Choose either date to explore nine consecutive days, from June 16, 1995 to today.</p>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="gallery" class="gallery" aria-label="Astronomy pictures" aria-busy="false">
      <p class="placeholder">Select a date range and click “Get Space Images” to explore the cosmos.</p>
    </section>
    <noscript>Enable JavaScript to load NASA’s pictures.</noscript>
    <footer>An educational project using NASA’s APOD archive. Not affiliated with NASA.</footer>
  </main>

  <dialog id="imageModal" aria-labelledby="modalTitle">
    <button id="closeModal" type="button" aria-label="Close details">×</button>
    <div id="modalMedia"></div>
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="date"></p>
      <p id="modalExplanation"></p>
      <p id="modalCredit" class="credit"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
